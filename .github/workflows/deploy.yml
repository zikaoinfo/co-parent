# Déploiement de l'app sur GitHub Pages à chaque push sur main.
# Prérequis côté repo : Settings -> Pages -> Source : « GitHub Actions ».
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Tests unitaires
        run: npm test -- --watch=false
      - name: Build de production
        # base-href = nom du repo (site projet https://<user>.github.io/co-parent/)
        run: npx ng build --base-href=/co-parent/
      - name: Fallback SPA pour les liens profonds (/join/…)
        run: cp dist/notre-garde/browser/index.html dist/notre-garde/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/notre-garde/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Intégration continue sur toutes les branches (tests + build), puis
# déploiement sur GitHub Pages — celui-ci uniquement depuis main.
# Prérequis côté repo : Settings -> Pages -> Source : « GitHub Actions ».
name: CI et déploiement GitHub Pages

on:
  push:
    # Toutes les branches : une branche de travail est vérifiée avant sa fusion.
    # (Pas de déclencheur pull_request : les branches vivent dans ce dépôt, les
    # checks du push apparaissent déjà sur la PR — inutile de doubler les runs.)
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# Une exécution à la fois par branche ; un nouveau push annule le run précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Tests unitaires
        run: npm test -- --watch=false
      - name: Build de production
        # base-href = nom du repo (site projet https://<user>.github.io/co-parent/)
        run: npx ng build --base-href=/co-parent/
      - name: Fallback SPA pour les liens profonds (/join/…)
        run: cp dist/notre-garde/browser/index.html dist/notre-garde/browser/404.html
      - name: Artefact Pages (main uniquement)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/notre-garde/browser

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
